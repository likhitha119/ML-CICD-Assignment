
name: ML Model CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  CI:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ML model
        run: python model.py

      - name: Run automated tests
        run: pytest -v

  CD:
    name: Continuous Deployment
    needs: CI
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate webpage with actual accuracy
        run: |
          mkdir -p site
          ACCURACY=$(python -c "from model import train_model; _, a = train_model(); print(f'{a*100:.2f}%')")
          export ACCURACY
          python -c "import os; from pathlib import Path; html = Path('index.html').read_text(); html = html.replace('{{ACCURACY}}', os.environ['ACCURACY']); Path('site/index.html').write_text(html)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload webpage
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy webpage
        id: deployment
        uses: actions/deploy-pages@v4
